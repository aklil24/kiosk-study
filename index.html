<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk Study – Team 2</title>
<!--
  Self-ordering kiosk prototype – UX & Usability, Team 2
  A = HIERARCHICAL (like McDonald's): Category → Subcategory → Product → Single/Set → Side → Drink → Customize
  B = LINEAR (like Subway):          fixed steps 1 Burger → 2 Customize → 3 Meal → 4 Side → 5 Drink → 6 Dessert → 7 Review
  C = FLAT (like a café kiosk):       all 24 products on one screen, all options in one pop-up, cart always visible
  Same menu, same prices, same start screen (Eat in / Take out) and same end point (Pay) in all three.
-->
<style>
  :root{--brand:#16727A;--brandD:#0F5A60;--ink:#13283B;--muted:#5B6B78;--line:#DDE5EA;--bg:#F5F8F9;--soft:#EEF5F5;--yellow:#FFC72C;--red:#D2462B;--note:#FFF4D6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.4}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit}
  button:disabled{opacity:.35;cursor:not-allowed}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
  h1{font-size:24px;margin:0}h2{font-size:20px;margin:0 0 10px}
  .muted{color:var(--muted)}.small{font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{padding:12px 20px;font-weight:700}
  .primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff;border:1px solid #e9b9aa;color:var(--red)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-weight:700;font-size:14px}
  input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px}
  .lang button{padding:6px 12px;background:#fff;border:1px solid var(--line)}.lang .on{background:var(--ink);color:#fff}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--brandD);font-weight:700;font-size:13px}
  .task-box{background:var(--note);border:1px solid #E0A100;border-radius:14px;padding:18px;font-size:20px;font-weight:700;margin:12px 0}
  .study{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  .study .task-box{font-size:17px;margin-top:0;position:sticky;top:12px}

  /* ================= KIOSK (portrait, like a real floor kiosk) ================= */
  .device{width:100%;max-width:560px;margin:0 auto;background:#1d2730;border-radius:30px;padding:16px 14px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .screen{background:#fff;border-radius:14px;height:880px;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .k-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--brand);color:#fff}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
  .logo i{font-style:normal;background:var(--yellow);color:var(--ink);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
  .k-top .tb{display:flex;gap:6px}.k-top .tb button{background:rgba(255,255,255,.18);padding:6px 10px;font-size:13px;font-weight:700}
  .k-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--soft);font-size:13px;color:var(--brandD);font-weight:700}
  .crumb{color:var(--muted);font-weight:600}
  .k-body{flex:1;overflow:auto;padding:14px}
  .k-title{font-size:22px;font-weight:800;margin:4px 0 12px}
  .k-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff}
  .k-bar .sum{flex:1}.k-bar .sum b{font-size:18px;display:block}
  .k-bar button{padding:14px 18px;font-weight:800}
  .pay{background:var(--yellow);color:var(--ink)}.nav{background:rgba(255,255,255,.15);color:#fff}
  .grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;text-align:center}
  .prod:hover{border-color:var(--brand)}
  .pic{width:72px;height:72px;border-radius:50%;background:#FFF3D1;display:grid;place-items:center;font-size:40px}
  .prod .nm{font-weight:700;font-size:14px;line-height:1.2}.prod .pr{font-size:13px;color:var(--muted)}
  .tag{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--red);color:#fff}
  .tag.new{background:var(--brand)}
  .cat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:190px;justify-content:center}
  .cat .pic{width:110px;height:110px;font-size:60px}.cat b{font-size:20px}
  .choice{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .choice.on{border-color:var(--brand);background:var(--soft)}
  .choice .pic{width:60px;height:60px;font-size:32px}
  .big2 .choice{padding:24px}.big2 .choice .pic{width:110px;height:110px;font-size:56px}.big2 .choice b{font-size:20px}
  .sect{font-weight:800;margin:14px 0 6px;font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:9px 13px;background:#fff;border:1.5px solid var(--line);border-radius:999px;font-size:14px}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.rm.on{background:var(--red);border-color:var(--red)}
  .hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}.hero .pic{width:96px;height:96px;font-size:54px}
  .line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line small{display:block;color:var(--muted);font-size:12px}
  .qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;background:var(--soft);font-weight:800}
  .x{background:none;color:var(--red);font-weight:800;padding:2px 6px}
  .steps{display:flex;gap:3px;padding:8px 10px;background:var(--soft)}
  .st{flex:1;text-align:center;font-size:11px;font-weight:700;padding:6px 2px;border-radius:7px;background:#fff;color:#9aa8b3}
  .st.now{background:var(--brand);color:#fff}.st.done{background:#cfe6e6;color:var(--brandD)}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;background:linear-gradient(180deg,#fff 0,#FFF3D1 100%)}
  .welcome .w{font-size:30px;font-weight:800;text-align:center}
  .welcome .grid{max-width:460px}
  .toast{position:absolute;left:50%;top:96px;z-index:9;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px}
  .modal-bg{position:absolute;inset:0;background:rgba(19,40,59,.5);display:flex;align-items:flex-end;z-index:5}
  .sheet{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-height:92%;overflow:auto}
  .flatsec{font-weight:800;font-size:14px;margin:8px 0 4px;color:var(--brandD);border-bottom:2px solid var(--soft);padding-bottom:2px}
  .flat .prod{padding:6px 4px}.flat .pic{width:48px;height:48px;font-size:26px}.flat .nm{font-size:12px}.flat .pr{font-size:11px}
  .cartbox{border-top:2px solid var(--line);padding:8px 14px;max-height:200px;overflow:auto;background:#fff}
  .cartbox .line{padding:5px 0;font-size:13px}
  /* survey */
  .qblock{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
  .qblock h3{margin:0 0 4px;font-size:16px}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .qrow:last-child{border-bottom:0}.qt{flex:1;min-width:260px}.qn{display:inline-block;width:24px;font-weight:800;color:var(--brand)}
  .scale{display:flex;gap:4px;width:100%;max-width:470px}
  .scale label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:5px 2px;background:#fff}
  .scale.wide{max-width:560px}
  .scale label.on{border-color:var(--brand);background:var(--soft)}
  .scale input{position:absolute;opacity:0;pointer-events:none}
  .scale b{font-size:16px}.scale span{font-size:10px;color:var(--muted);text-align:center;line-height:1.15;min-height:12px}
  .scale .na{background:#f3f3f3}
  .cards{display:flex;flex-wrap:wrap;gap:8px}
  .card-w{padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff}.card-w.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mods{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:14px}
  .dtab{border-collapse:collapse;width:100%;font-size:13px}.dtab th{background:var(--brand);color:#fff;text-align:left;padding:6px 8px}.dtab td{border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
  textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px}
  html,body{overflow-x:hidden}
  img,table{max-width:100%}
  @media (max-width:950px){.study{grid-template-columns:1fr}.study .task-box{position:static}}
  /* ===== phone ===== */
  @media (max-width:600px){
    .wrap{padding:10px}
    .card{padding:16px;border-radius:14px}
    h1{font-size:19px}h2{font-size:18px}
    .top{flex-wrap:wrap;gap:8px}
    .task-box{font-size:16px;padding:12px}
    .grid.g3{grid-template-columns:1fr}                 /* setup fields under each other */
    .mods{grid-template-columns:1fr}
    .qrow{flex-direction:column;align-items:stretch;gap:8px}
    .qt{min-width:0}
    .scale{max-width:none}
    .scale label{padding:6px 1px}
    .scale b{font-size:15px}.scale span{font-size:9px}
    .scale.wide span{display:none}                       /* NPS 0–10: numbers only, end labels are in the hint line */
    .btn{width:100%;margin-top:6px}
    .row .btn.small{width:auto}
    /* kiosk */
    .device{padding:8px 6px 12px;border-radius:20px}
    .screen{height:calc(100vh - 160px);min-height:560px;border-radius:12px}
    .welcome{padding:18px}.welcome .w{font-size:22px}
    .welcome .grid.g2{grid-template-columns:1fr}         /* Eat in / Take out under each other */
    .welcome .cat{min-height:120px;flex-direction:row;gap:16px}
    .welcome .cat .pic{width:70px;height:70px;font-size:38px}
    .k-body .grid.g3{grid-template-columns:repeat(2,1fr)}
    .k-body .grid.g4{grid-template-columns:repeat(2,1fr)}
    .flat .grid.g4{grid-template-columns:repeat(3,1fr)}
    .cat{min-height:130px;padding:12px}.cat .pic{width:70px;height:70px;font-size:38px}.cat b{font-size:17px}
    .big2 .choice{padding:14px}.big2 .choice .pic{width:70px;height:70px;font-size:36px}
    .k-top{padding:8px 10px}.logo{font-size:15px}.k-top .tb button{padding:5px 7px;font-size:11px}
    .k-bar{padding:8px 10px;gap:6px}.k-bar button{padding:11px 12px;font-size:14px}.k-bar .sum b{font-size:15px}
    .k-title{font-size:18px}
    .st{font-size:9px;padding:5px 1px}
    .line{flex-wrap:wrap}
    .hero .pic{width:64px;height:64px;font-size:34px}
  }
</style>
</head>

/* =========================================================================

/* An order line with all defaults filled in → two lines can be compared */
function norm(l){
  const it = ITEMS[l.id];
  if (it.cat === 'burger') return {id:l.id, set:!!l.set, rm:[...(l.rm||[])].sort(), add:[...(l.add||[])].sort(),
    side:l.set ? (l.side||'fries') : null, drink:l.set ? (l.drink||'cola') : null, dsize:l.set ? (l.dsize||'M') : null};
  if (it.opt === 'size') return {id:l.id, size:l.size||'M'};
  if (it.opt === 'coffee') return {id:l.id, temp:l.temp||'hot', size:l.size||'M'};
  return {id:l.id};
}
const key = (l) => JSON.stringify(norm(l));
const units = (lines) => lines.flatMap(l => Array(l.qty || 1).fill(key(l)));   // 2× set → 2 units

const STORE = 'kioskStudyTeam2_v2';
function freshState(){ return {screen:'setup', lang:'en', pid:'', order:'ABC', setOrder:'XYZ', consent:false, si:0, ti:0, attempt:0, ans:{}, part:{}, mod:null,
                               t0:null, k:null, records:[], events:[], surveys:[], msg:''}; }

try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e) {}

const mode = () => S.order[S.si], taskSet = () => S.setOrder[S.si], task = () => TASKS[taskSet()][S.ti];
const exp = () => task().order.map(l => ({...norm(l), qty:l.qty || 1}));

/* Kiosk state for one task.  cur = product being configured */
function newKiosk(){ return {dine:null, view:'welcome', cat:null, sub:null, step:1, cur:null, sheet:false, cart:[], pendingIdx:null, toast:'', taps:0, errors:0}; }

/* =========================================================================
   5. LOGGING
   ========================================================================= */
function logEvent(action, value, isErr){
  const k = S.k; k.taps++; if (isErr) k.errors++;
  S.events.push({participant_id:S.pid, session:S.si+1, interface:mode(), task_set:taskSet(), task_id:task().id, attempt:S.attempt,
    time_iso:new Date().toISOString(), elapsed_s:((Date.now()-S.t0)/1000).toFixed(2),
    view:mode()==='B' && k.view==='menu' ? 'step'+k.step : k.view, action, value:value ?? '', error:isErr ? 1 : 0});
}

/* =========================================================================
   6. ERROR RULES – a tap is an error if it leads away from the task goal
   ========================================================================= */
const E = {
  dine: (v) => v !== task().dine,
  cat:  (c) => !exp().some(l => ITEMS[l.id].cat === c),
  sub:  (s) => !exp().some(l => ITEMS[l.id].sub === s),
  prod: (id) => !exp().some(l => l.id === id),
  kind: (id, set) => { const l = exp().find(x => x.id === id); return !!l && l.set !== set; },
  opt:  (field, v) => {                        // option for the product being configured
    const c = S.k.cur; if (!c) return false; const l = exp().find(x => x.id === c.id); if (!l) return false;
    if (field === 'rm' || field === 'add') return (!c[field].includes(v)) !== l[field].includes(v);
    return l[field] !== undefined && l[field] !== null && v !== l[field];
  },
  plus: (i) => { const line = S.k.cart[i]; const want = units(task().order).filter(u => u === key(line)).length;
                 const have = units(S.k.cart).filter(u => u === key(line)).length; return have + 1 > want; },
};

/* =========================================================================
   7. ORDER HELPERS
   ========================================================================= */
function price(l){
  const it = ITEMS[l.id]; let p = l.set ? it.sp : it.p;
  if (it.cat === 'burger'){ (l.add||[]).forEach(a => p += EXTRA[a].p); if (l.set){ p += SET_SIDES[l.side||'fries']; if (l.dsize === 'L') p += 500; } }
  else if (l.size === 'L') p += 500;
  return p * (l.qty || 1);
}
const total = () => S.k.cart.reduce((s, l) => s + price(l), 0);
const count = () => S.k.cart.reduce((s, l) => s + (l.qty || 1), 0);
function describe(l){
  const n = norm(l), d = [];
  if (n.set) d.push(nm(n.side) + ', ' + nm(n.drink) + ' ' + n.dsize);
  if (n.rm && n.rm.length) d.push(n.rm.map(x => REMOVE[x][S.lang]).join(', ') + ' ' + t('without'));
  if (n.add && n.add.length) d.push(n.add.map(x => EXTRA[x][S.lang]).join(', ') + ' ' + t('extra'));
  if (n.temp) d.push(t(n.temp));
  if (n.size) d.push(t('size') + ' ' + n.size);
  return d.join(' · ');
}
function addCur(){ const c = S.k.cur; S.k.cart.push(JSON.parse(JSON.stringify(c))); S.k.cur = null; S.k.sheet = false; S.k.toast = t('added'); }
function compare(){
  const want = units(task().order), got = units(S.k.cart), rest = [...got]; let missing = 0;
  want.forEach(w => { const i = rest.indexOf(w); if (i >= 0) rest.splice(i, 1); else missing++; });
  return {ok: missing === 0 && rest.length === 0 && S.k.dine === task().dine, missing, extra: rest.length};
}

const sideChoices  = (c) => `<div class="grid g3">` + Object.keys(SET_SIDES).map(s => `<button class="choice ${c.side===s?'on':''}" data-act="o-side" data-v="${s}">${pic(ITEMS[s].ic)}<b>${nm(s)}</b><span class="small muted">${SET_SIDES[s] ? '+' + won(SET_SIDES[s]) : ''}</span></button>`).join('') + `</div>`;

/* =========================================================================
   9. INTERFACE A – HIERARCHICAL (deep: one decision per screen)
   home → (sub) → list → [burger: kind → (set: side → drink) → custom] / [others: opts] → home
   ========================================================================= */
function kioskA(){
  const k = S.k, c = k.cur;
  if (k.view === 'welcome') return topBar() + welcome();
  const backBtn = `<button class="nav" data-act="a-back">‹ ${t('back')}</button>`;
  const cartBar = sumBox() + `<button class="pay" data-act="review" ${k.cart.length?'':'disabled'}>${t('viewOrder')}</button>`;
  if (k.view === 'home') return frame(`<div class="grid g2">` + Object.keys(CATS).map(cat => `<button class="cat" data-act="a-cat" data-v="${cat}">${pic(CAT_IC[cat])}<b>${t(cat)}</b></button>`).join('') + `</div>`, cartBar);
  if (k.view === 'sub') return frame(`<div class="k-title">${t(k.cat)}</div><div class="grid g1" style="display:grid;gap:10px">` + CATS[k.cat].map(s => `<button class="cat" style="min-height:150px;flex-direction:row;justify-content:flex-start;gap:20px" data-act="a-sub" data-v="${s}">${pic(CAT_IC[s])}<b>${t(s)}</b></button>`).join('') + `</div>`, backBtn + cartBar);
  if (k.view === 'list') return frame(`<div class="k-title">${t(k.sub || k.cat)}</div><div class="grid g2">` + list(k.cat, k.sub).map(id => prodBtn('a-prod', id, k.cat==='burger' ? `${t('single')} ${won(ITEMS[id].p)}` : null)).join('') + `</div>`, backBtn + cartBar);
  if (k.view === 'kind') return frame(hero(c, false) + `<div class="k-title">${t('chooseKind')}</div><div class="grid g2 big2">
      <button class="choice" data-act="a-kind" data-v="single">${pic(ITEMS[c.id].ic)}<b>${t('single')}</b><span>${won(ITEMS[c.id].p)}</span></button>
      <button class="choice" data-act="a-kind" data-v="set"><div class="pic" style="font-size:30px">🍔🍟🥤</div><b>${t('set')}</b><span>${won(ITEMS[c.id].sp)}</span><span class="small muted">${t('setInfo')}</span></button></div>`, backBtn);
  if (k.view === 'side')   return frame(hero(c) + `<div class="k-title">${t('chooseSide')}</div>` + sideChoices(c), backBtn + `<span style="flex:1"></span><button class="pay" data-act="a-next">${t('next')} ›</button>`);
  if (k.view === 'drink')  return frame(hero(c) + `<div class="k-title">${t('chooseDrink')}</div>` + drinkChoices(c), backBtn + `<span style="flex:1"></span><button class="pay" data-act="a-next">${t('next')} ›</button>`);
  if (k.view === 'custom') return frame(hero(c) + `<div class="k-title">${t('customize')}</div>` + customChoices(c), backBtn + `<span style="flex:1"></span><button class="pay" data-act="add">${t('add')}</button>`);
  if (k.view === 'opts')   return frame(hero(c) + itemOptions(c), backBtn + `<span style="flex:1"></span><button class="pay" data-act="add">${t('add')}</button>`);
  if (k.view === 'review') return frame(reviewBody(), `<button class="nav" data-act="a-more">${t('addMore')}</button>` + sumBox() + `<button class="pay" data-act="pay" ${k.cart.length?'':'disabled'}>${t('pay')}</button>`);
}

/* =========================================================================
   10. INTERFACE B – LINEAR (fixed sequence, every step is shown)
   ========================================================================= */
function stepBar(){ return `<div class="steps">` + [1,2,3,4,5,6,7].map(i => `<div class="st ${S.k.step===i?'now':S.k.step>i?'done':''}">${i} ${t('b'+i)}</div>`).join('') + `</div>`; }
function kioskB(){
  const k = S.k, c = k.cur;
  if (k.view === 'welcome') return topBar() + welcome();
  const back = k.step > 1 ? `<button class="nav" data-act="b-back">‹ ${t('back')}</button>` : '';
  const nextBtn = (label) => `<span style="flex:1"></span><button class="pay" data-act="b-next">${label} ›</button>`;
  let body = '', bar = '';
  if (k.step === 1){ body = `<div class="k-title">${t('pickBurger')}</div><div class="grid g2">` + list('burger').map(id => prodBtn('b-burger', id)).join('') + `</div>`; bar = back + sumBox(); }
  if (k.step === 2){ body = hero(c, false) + `<div class="k-title">${t('customize')}</div>` + customChoices(c); bar = back + nextBtn(t('next')); }
  if (k.step === 3){ body = hero(c, false) + `<div class="k-title">${t('chooseKind')}</div><div class="grid g2 big2">
      <button class="choice ${!c.set?'on':''}" data-act="b-kind" data-v="single">${pic(ITEMS[c.id].ic)}<b>${t('single')}</b><span>${won(ITEMS[c.id].p)}</span></button>
      <button class="choice ${c.set?'on':''}" data-act="b-kind" data-v="set"><div class="pic" style="font-size:30px">🍔🍟🥤</div><b>${t('set')}</b><span>${won(ITEMS[c.id].sp)}</span></button></div>`; bar = back + nextBtn(t('next')); }
  if (k.step === 4){ body = c.set ? `<div class="k-title">${t('chooseSide')}</div>` + sideChoices(c)
                                  : `<div class="k-title">${t('addSide')}</div><div class="grid g4">` + list('side').map(id => prodBtn('b-extra', id)).join('') + `</div>`;
                     bar = back + nextBtn(c.set ? t('next') : t('skipStep') + ' / ' + t('next')); }
  if (k.step === 5){ body = c.set ? `<div class="k-title">${t('chooseDrink')}</div>` + drinkChoices(c)
                                  : `<div class="k-title">${t('addDrink')}</div><div class="grid g4">` + list('drink').map(id => prodBtn('b-extra', id)).join('') + `</div>`;
                     bar = back + nextBtn(c.set ? t('next') : t('skipStep') + ' / ' + t('next')); }
  if (k.step === 6){ body = `<div class="k-title">${t('addDessert')}</div><div class="grid g4">` + list('dessert').map(id => prodBtn('b-extra', id)).join('') + `</div>`; bar = back + nextBtn(t('skipStep') + ' / ' + t('next')); }
  if (k.step === 7){ body = reviewBody() + `<button class="btn ghost" style="width:100%" data-act="b-again">${t('anotherMenu')}</button>`; bar = back + sumBox() + `<button class="pay" data-act="pay" ${k.cart.length?'':'disabled'}>${t('pay')}</button>`; }
  const sheet = k.sheet ? `<div class="modal-bg"><div class="sheet">${hero(c)}${itemOptions(c)}<div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" data-act="sheet-cancel">${t('cancel')}</button><button class="btn primary" data-act="add">${t('add')}</button></div></div></div>` : '';
  return topBar() + stepBar() + `<div class="k-body">${body}</div><div class="k-bar">${bar}</div>${toast()}${sheet}`;
}

/* =========================================================================
   11. INTERFACE C – FLAT (everything on one screen, all options in one pop-up)
   ========================================================================= */
function kioskC(){
  const k = S.k, c = k.cur;
  if (k.view === 'welcome') return topBar() + welcome();
  const sec = (title, ids) => `<div class="flatsec">${title}</div><div class="grid g4">` + ids.map(id => prodBtn('c-prod', id, ITEMS[id].sp ? `${won(ITEMS[id].p)} / ${t('set')} ${won(ITEMS[id].sp)}` : null)).join('') + `</div>`;
  const body = `<div class="flat">${sec(t('burger'), list('burger'))}${sec(t('side'), list('side'))}${sec(t('drink'), list('drink'))}${sec(t('dessert'), list('dessert'))}</div>`;
  let sheet = '';
  if (k.sheet){
    const burger = ITEMS[c.id].cat === 'burger';
    sheet = `<div class="modal-bg"><div class="sheet">${hero(c)}
      ${burger ? `<div class="sect">${t('chooseKind')}</div><div class="chips">${chip('c-kind','single',!c.set,t('single') + ' ' + won(ITEMS[c.id].p))}${chip('c-kind','set',c.set,t('set') + ' ' + won(ITEMS[c.id].sp))}</div>` : ''}
      ${burger && c.set ? `<div class="sect">${t('chooseSide')}</div>${sideChoices(c)}<div class="sect">${t('chooseDrink')}</div>${drinkChoices(c)}` : ''}
      ${burger ? customChoices(c) : itemOptions(c)}
      <div class="sect">${t('qty')}</div><div class="qty"><button data-act="c-qty" data-v="-1">−</button><b>${c.qty}</b><button data-act="c-qty" data-v="1">+</button></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-act="sheet-cancel">${t('cancel')}</button><button class="btn primary" data-act="add">${t('add')}</button></div></div></div>`;
  }
  return topBar() + `<div class="k-body">${body}</div><div class="cartbox">${cartLines()}</div>
    <div class="k-bar">${sumBox()}<button class="pay" data-act="pay" ${k.cart.length?'':'disabled'}>${t('pay')}</button></div>${toast()}${sheet}`;
}

/* =========================================================================
   12. WHAT HAPPENS ON EACH TAP
   ========================================================================= */
function onKiosk(act, v){
  const k = S.k, c = k.cur; k.toast = '';
  switch (act){
    // ---- shared
    case 'dine': logEvent(act, v, E.dine(v)); k.dine = v; k.view = mode() === 'A' ? 'home' : 'menu'; break;
    case 'cancelOrder': logEvent(act); Object.assign(k, newKiosk(), {taps:k.taps, errors:k.errors}); break;
    case 'home': logEvent(act); k.view = 'home'; k.cat = k.sub = null; k.cur = null; break;
    case 'o-side':  logEvent(act, v, E.opt('side', v));  c.side = v; break;
    case 'o-drink': logEvent(act, v, E.opt('drink', v)); c.drink = v; break;
    case 'o-dsize': logEvent(act, v, E.opt('dsize', v)); c.dsize = v; break;
    case 'o-size':  logEvent(act, v, E.opt('size', v));  c.size = v; break;
    case 'o-temp':  logEvent(act, v, E.opt('temp', v));  c.temp = v; break;
    case 'o-rm':  logEvent(act, v, E.opt('rm', v));  { const i = c.rm.indexOf(v);  i >= 0 ? c.rm.splice(i, 1)  : c.rm.push(v); } break;
    case 'o-add': logEvent(act, v, E.opt('add', v)); { const i = c.add.indexOf(v); i >= 0 ? c.add.splice(i, 1) : c.add.push(v); } break;
    case 'add': logEvent(act, c.id); addCur(); if (mode() === 'A'){ k.view = 'home'; k.cat = k.sub = null; } break;
    case 'sheet-cancel': logEvent(act); k.cur = (mode() === 'B' ? k.burger : null); k.sheet = false; break;
    case 'plus':   logEvent(act, k.cart[v].id, E.plus(+v)); k.cart[v].qty++; break;
    case 'minus':  logEvent(act, k.cart[v].id); if (k.cart[v].qty > 1) k.cart[v].qty--; break;
    case 'remove': logEvent(act, k.cart[v].id); k.cart.splice(+v, 1); break;
    case 'review': logEvent(act); k.view = 'review'; break;
    case 'pay':    logEvent(act); finishTask(false); return;
    // ---- A: hierarchical
    case 'a-cat':  logEvent(act, v, E.cat(v)); k.cat = v; k.sub = null; k.view = CATS[v] ? 'sub' : 'list'; break;
    case 'a-sub':  logEvent(act, v, E.sub(v)); k.sub = v; k.view = 'list'; break;
    case 'a-prod': logEvent(act, v, E.prod(v)); k.cur = blankCfg(v); k.view = ITEMS[v].cat === 'burger' ? 'kind' : ITEMS[v].opt ? 'opts' : null;
                   if (!k.view){ addCur(); k.view = 'list'; } break;              // no options → added directly
    case 'a-kind': logEvent(act, v, E.kind(c.id, v === 'set')); c.set = v === 'set'; k.view = c.set ? 'side' : 'custom'; break;
    case 'a-next': logEvent(act); k.view = k.view === 'side' ? 'drink' : 'custom'; break;
    case 'a-back': logEvent(act);
      k.view = ({sub:'home', list: k.sub ? 'sub' : 'home', kind:'list', opts:'list', side:'kind', drink:'side', custom: c && c.set ? 'drink' : 'kind'})[k.view] || 'home';
      if (k.view === 'list' || k.view === 'home') k.cur = null; if (k.view === 'home') k.cat = k.sub = null; break;
    case 'a-more': logEvent(act); k.view = 'home'; k.cat = k.sub = null; break;
    // ---- B: linear
    case 'b-burger': logEvent(act, v, E.prod(v)); k.cur = k.burger = blankCfg(v); k.step = 2; break;
    case 'b-kind': logEvent(act, v, E.kind(c.id, v === 'set')); c.set = v === 'set'; break;
    case 'b-extra': logEvent(act, v, E.prod(v)); if (ITEMS[v].opt){ k.cur = blankCfg(v); k.sheet = true; } else { k.cur = blankCfg(v); addCur(); k.cur = k.burger; } break;
    case 'b-next': logEvent(act);
      if (k.step === 5){ k.cart.push(JSON.parse(JSON.stringify(k.burger))); k.pendingIdx = k.cart.length - 1; }   // burger goes into the order here
      k.step++; break;
    case 'b-back': logEvent(act);
      if (k.step === 6 && k.pendingIdx !== null){ k.cart.splice(k.pendingIdx, 1); k.pendingIdx = null; }
      if (k.step === 7) { k.step = 6; break; }
      k.step = Math.max(1, k.step - 1); break;
    case 'b-again': logEvent(act); k.step = 1; k.cur = k.burger = null; k.pendingIdx = null; break;
    // ---- C: flat
    case 'c-prod': logEvent(act, v, E.prod(v)); k.cur = blankCfg(v); k.sheet = true; break;
    case 'c-kind': logEvent(act, v, E.kind(c.id, v === 'set')); c.set = v === 'set'; break;
    case 'c-qty':  logEvent(act, v); c.qty = Math.max(1, c.qty + (+v)); break;
  }
  if (act === 'add' && mode() === 'B') k.cur = k.burger;   // after an extra, continue with the burger
}

try { const r = JSON.parse(localStorage.getItem(IDSTORE) || 'null'); if (r) REG = {used:r.used || {}, mod:{...DEFAULT_MOD, ...(r.mod || {})}}; } catch(e) {}
const saveReg = () => { try { localStorage.setItem(IDSTORE, JSON.stringify(REG)); } catch(e) {} };
/* ---- Data of all finished participants stays on this device (researcher only, PIN protected) */
const DATASTORE = 'kioskStudyTeam2_data';
let ARCH = {};
try { ARCH = JSON.parse(localStorage.getItem(DATASTORE) || '{}'); } catch(e) {}
const saveArch = () => { try { localStorage.setItem(DATASTORE, JSON.stringify(ARCH)); } catch(e) {} };
let unlocked = false;                         // researcher area open? (never saved)
const PIN = () => REG.pin || '1234';
function assign(pid){                       // counterbalancing: 6 interface orders × 4, task-set order rotates every 6 participants
  const i = IDS.indexOf(pid); if (i < 0) return;
  if (i < 24){ S.order = ORDERS[i % 6]; S.setOrder = SET_ORDERS[Math.floor(i / 6) % 3]; }
  else { S.order = ORDERS[(i - 24) % 6]; S.setOrder = SET_ORDERS[(i - 24) % 3]; }
}

/* =========================================================================
   14. STUDY FLOW
   ========================================================================= */
const M = () => S.mod || DEFAULT_MOD;
function startTask(){ S.k = newKiosk(); S.attempt++; S.t0 = Date.now(); S.screen = 'kiosk'; }
function finishTask(aborted){
  const k = S.k, res = compare();
  if (!aborted && res.missing){ k.errors += res.missing;
    S.events.push({participant_id:S.pid, session:S.si+1, interface:mode(), task_set:taskSet(), task_id:task().id, attempt:S.attempt,
      time_iso:new Date().toISOString(), elapsed_s:((Date.now()-S.t0)/1000).toFixed(2), view:'pay', action:'omission', value:res.missing, error:1}); }
  S.records.push({participant_id:S.pid, session:S.si+1, interface:mode(), task_set:taskSet(), interface_order:S.order, set_order:S.setOrder,
    task_id:task().id, success:(!aborted && res.ok) ? 1 : 0, status:aborted ? 'aborted' : res.ok ? 'success' : 'wrong_order',
    time_s:((Date.now()-S.t0)/1000).toFixed(2), taps:k.taps, errors:k.errors, dine:k.dine || '',
    expectation:S.ans.exp ?? '', seq:'', expected:JSON.stringify(units(task().order)), actual:JSON.stringify(units(k.cart))});
  S.k = null; S.ans = {};
  if (M().seq) S.screen = 'seq'; else afterTask();
}
function afterTask(){ S.ti++; S.screen = S.ti < 3 ? 'task' : 'survey'; S.ans = {}; }
const need = (names) => names.every(n => S.ans[n] !== undefined && S.ans[n] !== '');
function submit(){
  const A = S.ans, m = M(); S.msg = '';
  if (S.screen === 'pre'){
    if (!need(['age','gender','freq','conf'])) { S.msg = t('fillAll'); return; }
    Object.assign(S.part, {age:A.age, gender:A.gender, kiosk_use:A.freq, kiosk_confidence:A.conf}); S.ans = {}; S.screen = 'intro';
  } else if (S.screen === 'task'){                       // expectation rating, then start
    if (m.exp && !need(['exp'])) { S.msg = t('fillAll'); return; }
    S.ans = {exp:A.exp}; startTask();
  } else if (S.screen === 'seq'){
    if (!need(['seq'])) { S.msg = t('fillAll'); return; }
    S.records[S.records.length - 1].seq = A.seq; afterTask();
  } else if (S.screen === 'survey'){
    const req = [...(m.asq ? [1,2,3].map(i => 'asq' + i) : []), ...(m.sus ? Q.sus.en.map((_, i) => 'sus' + (i+1)) : []), ...(m.sat ? ['sat'] : []),
                 ...(m.csuq ? Q.csuq.en.map((_, i) => 'csuq' + (i+1)) : []), ...(m.nps ? ['nps'] : [])];
    if (!need(req) || (m.cards && !(A.cards || []).length)) { S.msg = t('fillAll'); return; }
    const num = (x) => x === 'NA' ? null : +x, mean = (xs) => { const v = xs.map(num).filter(x => x !== null); return v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : ''; };
    const row = {participant_id:S.pid, session:S.si+1, interface:mode(), task_set:taskSet(), interface_order:S.order};
    if (m.asq){ [1,2,3].forEach(i => row['asq' + i] = A['asq' + i]); row.asq_mean = mean([1,2,3].map(i => A['asq' + i])); }
    if (m.sus){ const a = Q.sus.en.map((_, i) => +A['sus' + (i+1)]); a.forEach((x, i) => row['sus' + (i+1)] = x); row.sus_score = susScore(a); }
    if (m.sat) row.satisfaction = A.sat;
    if (m.csuq){ const c = Q.csuq.en.map((_, i) => A['csuq' + (i+1)]); c.forEach((x, i) => row['csuq' + (i+1)] = x);
      row.csuq_sysuse = mean(c.slice(0, 8)); row.csuq_infoqual = mean(c.slice(8, 15)); row.csuq_interqual = mean(c.slice(15, 18)); row.csuq_overall = mean(c); }
    if (m.cards) row.reaction_cards = (A.cards || []).join('; ');
    if (m.nps){ row.nps = A.nps; row.nps_group = A.nps >= 9 ? 'promoter' : A.nps >= 7 ? 'passive' : 'detractor'; }
    if (m.open){ row.like_most = A.like || ''; row.like_least = A.dislike || ''; }
    row.time_iso = new Date().toISOString();
    S.surveys.push(row); S.ans = {}; S.si++; S.ti = 0;
    S.screen = S.si < 3 ? 'intro' : (m.final ? 'final' : 'done');
    if (S.screen === 'done') finishParticipant();
  } else if (S.screen === 'final'){
    if (!need(['best','worst'])) { S.msg = t('fillAll'); return; }
    Object.assign(S.part, {best:S.order[A.best], worst:S.order[A.worst], comment:A.why || ''}); S.ans = {}; S.screen = 'done'; finishParticipant();
  }
}
function partRow(){ return {participant_id:S.pid, interface_order:S.order, set_order:S.setOrder, lang:S.lang, ...S.part}; }
function finishParticipant(){
  S.part.finished = new Date().toISOString(); REG.used[S.pid] = 'done'; saveReg();
  ARCH[S.pid] = {records:S.records, events:S.events, surveys:S.surveys, part:partRow()}; saveArch();   // automatic backup
  if (REMOTE) sendData();
}
/* ---- ONLINE mode: talk to the Google Apps Script (see Code.gs) */
function deviceInfo(){
  return {screen:`${screen.width}x${screen.height}`, viewport:`${innerWidth}x${innerHeight}`, touch:('ontouchstart' in window) ? 1 : 0,
          user_agent:navigator.userAgent};
}
async function getRemoteId(){
  S.msg = t('rWait'); render();
  try {
    const r = await (await fetch(REMOTE_URL + '?action=nextId')).json();
    if (!r.ok) throw new Error(r.error || 'no id');
    S.pid = r.pid; S.order = r.order; S.setOrder = r.setOrder; S.msg = ''; S.consent = true;
    S.mod = {...REMOTE_MOD}; S.part = {started:new Date().toISOString(), ...deviceInfo()}; S.ans = {};
    S.screen = M().pre ? 'pre' : 'intro';
  } catch(err){ S.msg = t('rErr'); }
  save(); render();
}
async function sendData(){
  S.send = 'sending'; save(); render();
  try {
    const body = JSON.stringify({pid:S.pid, participant:partRow(), tasks:S.records, surveys:S.surveys, events:S.events});
    const r = await (await fetch(REMOTE_URL, {method:'POST', body})).json();   // text/plain → no CORS preflight
    S.send = r.ok ? 'sent' : 'error';
  } catch(err){ S.send = 'error'; }
  save(); render();
}

/* ---- CSV export */
function toCSV(rows){ if (!rows.length) return ''; const cols = [...new Set(rows.flatMap(r => Object.keys(r)))], qq = (x) => `"${String(x ?? '').replace(/"/g, '""')}"`;
  return [cols.join(','), ...rows.map(r => cols.map(c => qq(r[c])).join(','))].join('\n'); }
function download(name, rows, prefix){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + toCSV(rows)], {type:'text/csv;charset=utf-8'}));
  a.download = `${prefix || S.pid}_${name}.csv`; a.click(); }
function downloadSet(d, prefix){
  [['tasks', d.records], ['events', d.events], ['surveys', d.surveys], ...(d.part ? [['participant', [d.part]]] : [])].forEach(([n, r], i) => setTimeout(() => download(n, r, prefix), i * 300));
}
function downloadMerged(){                    // ALL participants in one file per type
  const all = Object.values(ARCH), stamp = new Date().toISOString().slice(0, 10);
  downloadSet({records:all.flatMap(d => d.records), events:all.flatMap(d => d.events), surveys:all.flatMap(d => d.surveys), part:null}, 'ALL_' + stamp);
  setTimeout(() => download('participant', all.map(d => d.part), 'ALL_' + stamp), 1300);
}

/* =========================================================================
   15. RENDER
   ========================================================================= */
const langSwitch = () => `<div class="lang row" style="gap:4px">${['en','ko'].map(l => `<button class="${S.lang===l?'on':''}" data-act="lang" data-v="${l}">${l.toUpperCase()}</button>`).join('')}</div>`;
/* one rating row: n points, labels under the end points (or all points), optional N/A */
function scale(name, n, labels, opts={}){
  const start = opts.zero ? 0 : 1, cur = S.ans[name];
  return `<div class="scale ${n > 7 ? 'wide' : ''}">` + Array.from({length:n}, (_, i) => { const v = start + i;
      return `<label class="${String(cur)===String(v)?'on':''}"><input type="radio" name="${name}" value="${v}" ${String(cur)===String(v)?'checked':''}><b>${v}</b><span>${labels && labels[i] ? labels[i] : ''}</span></label>`; }).join('') +
    (opts.na ? `<label class="na ${cur==='NA'?'on':''}"><input type="radio" name="${name}" value="NA" ${cur==='NA'?'checked':''}><b>N/A</b><span></span></label>` : '') + `</div>`;
}
const qrow = (num, text, control) => `<div class="qrow"><div class="qt">${num ? `<span class="qn">${num}</span>` : ''}${text}</div>${control}</div>`;
const block = (title, sub, inner) => `<div class="qblock"><h3>${title}</h3>${sub ? `<p class="muted small">${sub}</p>` : ''}${inner}</div>`;
function surveyPage(){
  const m = M(); let h = '';
  if (m.asq) h += block('ASQ', '1 = ' + Q.agree7[S.lang][0] + ' · 7 = ' + Q.agree7[S.lang][6], q('asq').map((x, i) => qrow(i+1, x, scale('asq' + (i+1), 7, Q.agree7[S.lang], {na:true}))).join(''));
  if (m.sus) h += block('SUS', '1 = ' + Q.agree5[S.lang][0] + ' · 5 = ' + Q.agree5[S.lang][4], q('sus').map((x, i) => qrow(i+1, x, scale('sus' + (i+1), 5, Q.agree5[S.lang]))).join(''));
  if (m.sat) h += block(q('satQ'), '', scale('sat', 5, Q.sat5[S.lang]));
  if (m.csuq) h += block('CSUQ', '1 = ' + Q.agree7[S.lang][0] + ' · 7 = ' + Q.agree7[S.lang][6], q('csuq').map((x, i) => qrow(i+1, x, scale('csuq' + (i+1), 7, Q.agree7[S.lang], {na:true}))).join(''));
  if (m.cards) h += block(q('cardsQ'), `${(S.ans.cards || []).length} / 5`, `<div class="cards">` + CARDS.map(([en, ko]) => { const on = (S.ans.cards || []).includes(en);
      return `<button class="card-w ${on?'on':''}" data-act="card" data-v="${en}">${S.lang==='ko' ? ko : en}</button>`; }).join('') + `</div>`);
  if (m.nps) h += block(q('npsQ'), '0 = ' + q('npsL')[0] + ' · 10 = ' + q('npsL')[1], scale('nps', 11, [q('npsL')[0],'','','','','','','','','',q('npsL')[1]], {zero:true}));
  if (m.open) h += block(q('likeQ'), '', `<textarea data-name="like" rows="2">${S.ans.like || ''}</textarea>`) + block(q('dislikeQ'), '', `<textarea data-name="dislike" rows="2">${S.ans.dislike || ''}</textarea>`);
  return h;
}
/* PIN box – small and quiet, so participants ignore it */
function pinBox(open){
  if (!open && !S.pinAsk) return `<div style="text-align:right;margin-top:30px"><button class="ghost" style="padding:6px 10px;color:#9aa8b3;border:0;background:none" data-act="pin-ask">⚙</button></div>`;
  return `<div class="card" style="margin-top:14px;max-width:360px"><b>Researcher PIN</b><div class="row" style="margin-top:8px">
    <input id="pin" type="password" inputmode="numeric" style="width:140px"><button class="btn primary" data-act="pin">OK</button>
    ${open ? '<button class="btn ghost" data-act="to-setup">← Back</button>' : ''}</div><p style="color:var(--red)">${S.msg || ''}</p></div>`;
}
/* Researcher data page: summary of all finished participants + downloads */
function dataPage(){
  const rows = Object.entries(ARCH).sort();
  const per = (d, f) => ['A','B','C'].map(m => { const x = d.surveys.find(r => r.interface === m); return x && x[f] !== undefined ? x[f] : '–'; }).join(' / ');
  const tr = rows.map(([id, d]) => { const ok = d.records.filter(r => r.success === 1).length, tm = d.records.length ? (d.records.reduce((a, r) => a + +r.time_s, 0) / d.records.length).toFixed(1) : '–';
    const tme = (m) => { const r = d.records.filter(x => x.interface === m); return r.length ? (r.reduce((a, x) => a + +x.time_s, 0) / r.length).toFixed(1) : '–'; };
    return `<tr><td><b>${id}</b></td><td>${d.part.interface_order} · ${d.part.set_order}</td><td>${ok}/${d.records.length}</td><td>${['A','B','C'].map(tme).join(' / ')}</td>
      <td>${per(d, 'sus_score')}</td><td>${(d.part.finished || '').slice(0, 16).replace('T', ' ')}</td><td><button class="btn ghost" style="padding:6px 10px" data-act="dl-p" data-v="${id}">⬇ CSV</button></td></tr>`; }).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>📊 Data – ${rows.length} participant(s)</h2><button class="btn ghost" data-act="to-setup">← Setup</button></div>

    <div style="overflow-x:auto;margin-top:14px"><table class="dtab"><tr><th>ID</th><th>Order</th><th>Success</th><th>Mean time s (A / B / C)</th><th>SUS (A / B / C)</th><th>Finished</th><th></th></tr>${tr || '<tr><td colspan="7" class="muted">No finished participants yet.</td></tr>'}</table></div>
    <details style="margin-top:16px"><summary class="small">Change PIN</summary><div class="row" style="margin-top:8px"><input id="newpin" type="password" inputmode="numeric" placeholder="new PIN" style="width:140px"><button class="btn ghost" data-act="setpin">Save</button></div></details></div>`;
}

    ${S.send === 'error' ? `<button class="btn primary" data-act="resend">${t('rRetry')}</button>` : ''}</div>`;
  else if (S.screen === 'done') h = `<div class="top"><span></span>${langSwitch()}</div><div class="card" style="text-align:center;padding:50px 20px">
    <div style="font-size:60px">🙏</div><h2>${t('done')}</h2><p>${t('doneText')}</p></div>
    ${unlocked ? `<div class="card" style="margin-top:14px"><h2>🔓 Researcher</h2><p class="muted small">Data of ${S.pid} is saved on this device automatically.</p>
      <div class="row"><button class="btn primary" data-act="dl-one">${t('dlAll')}</button><button class="btn ghost" data-act="data">📊 All data</button>
      <button class="btn danger" data-act="new">${t('newP')}</button></div></div>` : pinBox()}`;
  else if (S.screen === 'data') h = top() + (unlocked ? dataPage() : `<div class="card">${pinBox(true)}</div>`);
  document.getElementById('app').innerHTML = h;
}

/* ---- events */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'lang') S.lang = v;
  else if (act === 'resume'){ S = saved; saved = null; }
  else if (act === 'reset'){ try { localStorage.removeItem(STORE); } catch(err) {} saved = null; S = freshState(); }
  else if (act === 'release'){ delete REG.used[v]; saveReg(); }
  else if (act === 'start'){
    S.pid = document.getElementById('pid').value; S.order = document.getElementById('order').value;
    S.setOrder = document.getElementById('setOrder').value; S.consent = document.getElementById('consent').checked;
    if (!S.pid || !S.consent || REG.used[S.pid]) S.msg = !S.pid || REG.used[S.pid] ? t('pid') + '?' : t('consent') + '?';
    else { S.msg = ''; saved = null; S.mod = {...REG.mod}; S.part = {started:new Date().toISOString()}; S.ans = {};
           REG.used[S.pid] = 'started'; saveReg(); S.screen = M().pre ? 'pre' : 'intro'; }
  }
  else if (act === 'go') S.screen = 'task';
  else if (act === 'skip') finishTask(true);
  else if (act === 'submit') submit();
  else if (act === 'pick'){ S.ans[b.dataset.n] = v; }
  else if (act === 'card'){ const c = S.ans.cards = S.ans.cards || []; const i = c.indexOf(v); if (i >= 0) c.splice(i, 1); else if (c.length < 5) c.push(v); }
  else if (act === 'r-start'){ if (!document.getElementById('consent').checked){ S.msg = t('rConsent').split('.')[0] + ' ✓ ?'; } else { S.consent = true; getRemoteId(); return; } }
  else if (act === 'resend'){ sendData(); return; }
  else if (act === 'pin-ask'){ S.pinAsk = true; S.msg = ''; }
  else if (act === 'pin'){ if (document.getElementById('pin').value === PIN()){ unlocked = true; S.pinAsk = false; S.msg = ''; } else S.msg = 'Wrong PIN'; }
  else if (act === 'data'){ S.back = S.screen; S.msg = ''; S.screen = 'data'; }
  else if (act === 'to-setup'){ S.screen = S.back === 'done' ? 'done' : 'setup'; S.msg = ''; }
  else if (act === 'dl-one' && unlocked) downloadSet({records:S.records, events:S.events, surveys:S.surveys, part:partRow()});
  else if (act === 'dl-p' && unlocked) downloadSet(ARCH[v], v);
  else if (act === 'dl-merged' && unlocked) downloadMerged();
  else if (act === 'setpin' && unlocked){ const p = document.getElementById('newpin').value.trim(); if (p){ REG.pin = p; saveReg(); } }
  else if (act === 'new' && unlocked){ const lang = S.lang; S = freshState(); S.lang = lang; unlocked = false; try { localStorage.removeItem(STORE); } catch(err) {} }
  else if (S.screen === 'kiosk') onKiosk(act, v);
  save(); render();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type === 'radio'){ S.ans[el.name] = el.value === 'NA' ? 'NA' : +el.value; save(); render(); }
  else if (el.dataset.mod){ REG.mod[el.dataset.mod] = el.checked; saveReg(); }
  else if (el.id === 'pid'){ S.pid = el.value; assign(el.value); render(); }
});
document.addEventListener('input', (e) => { const n = e.target.dataset.name; if (n){ S.ans[n] = e.target.value; save(); } });
/* ONLINE mode start: continue an unfinished session, re-send unsent data, block a second participation */
if (REMOTE && saved && saved.pid){
  if (saved.screen === 'done' && saved.send === 'sent') S.screen = 'already';
  else { S = saved; saved = null; if (S.screen === 'done' && S.send !== 'sent') sendData(); }
}
render();
</script>
</body>
</html>
